<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pesquisar Filmes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="menu.html">
                Pobre Flix
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Menu</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sobre.html">Sobre</a>
                    </li>

                    <li class="nav-item">
                        <button onclick="logout()" class="btn btn-danger ms-lg-3">
                            Sair
                        </button>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main>

    <div class="container mt-5">

        <h1 class="text-center mb-4">

            Pesquisar Filmes e Séries

        </h1>

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="input-group">

                    <input type="text" id="pesquisa" class="form-control" placeholder="Digite o nome do filme ou série">

                    <button class="btn btn-primary" onclick="buscarFilme()">

                        Pesquisar

                    </button>

                </div>

            </div>

        </div>

        <div id="loading" class="text-center mt-5" style="display:none;">

            <div class="spinner-border text-danger" role="status"></div>

            <p class="mt-3">Pesquisando...</p>

        </div>

        <div class="row mt-5" id="resultado">

        </div>

    </div>

    </main>

    <footer>

        Pobre Flix © 2026

    </footer>

    <script>

        if (localStorage.getItem("logado") != "true") {

            window.location = "index.html";

        }

        function logout() {

            localStorage.removeItem("logado");

            window.location = "index.html";

        }

    </script>

    <script src="js/pesquisa.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
